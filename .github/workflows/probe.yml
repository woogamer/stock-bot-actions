name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "runner country: $(curl -s https://ipinfo.io/country)"
          curl -s -o /dev/null -w "TOSS token(빈 요청) %{http_code} total=%{time_total}s\n" -X POST https://openapi.tossinvest.com/oauth2/token -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=client_credentials" --max-time 60 || echo "TOSS token FAILED"
          curl -s -o /dev/null -w "TOSS docs %{http_code} total=%{time_total}s\n" https://openapi.tossinvest.com/openapi-docs/latest/openapi.json --max-time 60 || echo "TOSS docs FAILED"
          curl -s -o /dev/null -w "TOSS websocket host %{http_code} connect=%{time_connect}s\n" https://openapi-ws.tossinvest.com/ws/v1 --max-time 30 || echo "TOSS ws FAILED"
          curl -s -o /dev/null -w "KIS 실전 %{http_code} total=%{time_total}s\n" -X POST https://openapi.koreainvestment.com:9443/oauth2/tokenP -H "Content-Type: application/json" -d '{}' --max-time 60 || echo "KIS 실전 FAILED"
